services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=onleyici_bakim;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Database__Provider: PostgreSql
      Database__SeedDevelopmentData: "false"
      Database__UseBakimYonetimiReadModel: "false"
      MlService__BaseUrl: http://ml:5001
      MlService__PredictionEndpoint: /api/v1/predict
      MlService__UseMock: "false"
      MlService__ApiKey: ${ML_API_KEY:-}
      HybridRisk__MlFailurePolicy: AlgorithmOnlyFallback
      Integrations__ApiKey: ${INTEGRATION_API_KEY:-local-development-key}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    build:
      context: ./MlService
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      ML_API_KEY: ${ML_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: onleyici_bakim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onleyici_bakim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
